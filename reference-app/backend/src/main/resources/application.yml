server:
  address: 127.0.0.1
  port: ${PORT:18080}
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: strict
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/campus;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai
  web:
    resources:
      static-locations: classpath:/static/
app:
  seed: ${DEMO_SEED:true}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
