openapi: 3.0.3
info:
  title: 校园循环 · 后端接口契约
  version: 1.0.0-2026-10-29
  description: |
    校园二手交易与物品流转平台后端接口。所有业务接口位于 /api。
    身份基于服务端 Session；所有非 GET 请求须带 X-CSRF-Token（由 GET /api/me、注册或登录响应下发）。
    POST /api/orders 与 POST /api/orders/{id}/{action} 还须带 Idempotency-Key；
    POST /api/items 与 PUT /api/items/{id} 可选带 Idempotency-Key，带标识时同一提交意图只成立一次。
    错误统一为 {"message": "..."}：400 输入或业务条件不满足、401 未登录、403 越权或 CSRF 失败、
    404 不存在、409 冲突或并发锁冲突、500 未预期异常、503 数据库不可用。
    时间均为 UTC ISO-8601（Z 结尾），金额为人民币元且保留两位小数。
    详细说明与业务规则见同目录 README.md。
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/health:
    get:
      summary: 运行健康检查
      security: []
      responses:
        '200':
          description: 应用与数据库可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/me:
    get:
      summary: 当前会话用户与 CSRF 令牌
      security: []
      responses:
        '200':
          description: 未登录时 user 为 null
          content:
            application/json:
              schema:
                type: object
                required: [csrf]
                properties:
                  user:
                    allOf:
                      - $ref: '#/components/schemas/PublicUser'
                    nullable: true
                  csrf:
                    type: string
  /api/auth/register:
    post:
      summary: 注册账户
      security: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, nickname]
              properties:
                username:
                  type: string
                  pattern: '^[A-Za-z0-9_]{3,40}$'
                password:
                  type: string
                  minLength: 8
                  description: |
                    按原文保存，不做 trim：首尾空格是凭据的一部分，登录时必须原样提供。
                    至少 8 个字符（code point），UTF-8 不超过 72 字节，不能全为空白；否则注册直接 400 拒绝，绝不注册后再改写。
                    以字符串接收（数字等非字符串返回 400）。
                nickname:
                  type: string
                  maxLength: 30
      responses:
        '200':
          description: 注册并建立会话
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/PublicUser'
                  csrf:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/auth/login:
    post:
      summary: 登录
      security: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 登录成功，会话标识已更换
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/PublicUser'
                  csrf:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/logout:
    post:
      summary: 退出并失效当前会话
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/items:
    get:
      summary: 检索公开可交易物品
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: |
            每页 20 条。按字段列出的公开投影：id, seller_id, seller_name, title, category, description,
            price, image_id, version, status, created_at；不返回 reason（管理员审核说明）及 hidden、
            relist_allowed 等治理内部字段。BR14：title、description 与 seller_name 返回前按
            ImageGuard.mask 脱敏（与公开评价同一规则），历史已存内容同样处理；库中原文不改写，
            价格/ID 不处理，正常型号（如 iPhone13）不受影响。本人 /api/items/mine 与管理台保持原文。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicItem'
    post:
      summary: 发布物品（进入待审）
      description: 可选带 Idempotency-Key；同一操作者、同一标识、相同内容的重复提交（含响应丢失后的重试）返回原物品，不重复创建；同一标识改变内容返回 400。不同标识仍是新发布。
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '200':
          description: 新建物品或同一标识的重放结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/items/mine:
    get:
      summary: 本人发布的物品（含历史状态）
      responses:
        '200':
          description: 物品列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/items/{id}:
    put:
      summary: 修改本人可修改物品（版本 +1 并重新审核）
      description: 可选带 Idempotency-Key；同一操作者、同一标识、相同内容的重复提交返回原版本，不再次递增版本；同一标识改变内容返回 400。
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '200':
          description: 更新后的物品或同一标识的重放结果（原版本）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/items/{id}/withdraw:
    post:
      summary: 撤下本人无有效订单的物品
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: 已撤下
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/verifications:
    get:
      summary: 本人认证申请历史
      responses:
        '200':
          description: 认证记录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verification'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: 提交校园认证
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_no, real_name, asset_id]
              properties:
                student_no:
                  type: string
                  maxLength: 50
                real_name:
                  type: string
                  maxLength: 50
                asset_id:
                  type: string
                  description: 本人上传的 VERIFY 类型图片
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/favorites:
    get:
      summary: 本人收藏
      description: |
        收藏关系始终保留。只有当物品当前仍公开可交易时（与市场同一规则：在售、未隐藏、物主未受限、无占用）
        才返回 title/price/status；否则该条只返回 {id, unavailable:true}，不露出待审/隐藏/受限/撤回后的任何内容。
        新版本通过审核、恢复公开后自动展示最新内容；期间仍可 DELETE/PUT 取消收藏。
      responses:
        '200':
          description: 收藏摘要（可访问条目含内容，不可访问条目为 id+unavailable 占位）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoriteEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/favorites/{id}:
    post:
      summary: 加入收藏（幂等）
      description: 明确表达“收藏”意图：已是收藏时保持已收藏，重复请求不会反向取消。
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: 已收藏
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      summary: 取消收藏（幂等）
      description: 明确表达“取消收藏”意图：未收藏时也成功，重复请求保持未收藏。
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: 已取消收藏
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: 明确设置收藏目标状态
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite:
                  type: boolean
                  description: true 为收藏，false 为取消；重复设置同一目标状态结果不变
      responses:
        '200':
          description: 目标状态已生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/sellers/{id}/reviews:
    get:
      summary: 卖方已公开评价
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 公开评价
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    score:
                      type: integer
                    content:
                      type: string
                    created_at:
                      $ref: '#/components/schemas/Time'
                    nickname:
                      type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/orders:
    get:
      summary: 本人作为买方或卖方的订单
      responses:
        '200':
          description: 订单列表（按下单时间倒序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: 下单并唯一预占物品
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id, version]
              properties:
                item_id:
                  type: string
                version:
                  type: integer
                  description: 下单前看到的物品版本；版本不符拒绝
      responses:
        '200':
          description: 新订单或同一标识的重放结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/orders/{id}/{action}:
    post:
      summary: 订单阶段操作
      description: |
        accept=卖方接单（待卖方确认→待交付）；reject=卖方拒单（→已拒绝，需 reason）；
        deliver=卖方登记交付（待交付→待买方确认，需 declared=true 与 reason）；
        confirm=买方本人确认（待买方确认→已完成，需 declared=true）；
        cancel=当事人普通取消（待卖方确认/待交付，需 declared=true 与 reason，无交付登记、无处理中争议）；
        remind=卖方在待买方确认阶段提醒一次。
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [accept, reject, deliver, confirm, cancel, remind]
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
                declared:
                  type: boolean
                  description: 交付、收货或未交付的事实声明
      responses:
        '200':
          description: 操作后的订单当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/orders/{id}/details:
    get:
      summary: 当事人订单详情（进度、交付登记明细与评价）
      description: 仅订单买方或卖方本人可读；delivery 为交付登记（操作者、说明与时间，未登记为 null），reviews 为脱敏后的本单评价。
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/orders/{id}/reviews:
    get:
      summary: 该订单的评价（含隐藏标记）
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 评价列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 评价已完成订单
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score, content]
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                content:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: 已评价
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/disputes:
    get:
      summary: 本人订单相关的履约争议
      responses:
        '200':
          description: 争议列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dispute'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/orders/{id}/disputes:
    post:
      summary: 对未结束订单申请履约争议
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1500
                evidence:
                  type: string
                  maxLength: 5000
      responses:
        '200':
          description: 已受理，订单保留原阶段与占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/disputes/{id}/evidence:
    post:
      summary: 争议补证（未结案）
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence]
              properties:
                evidence:
                  type: string
                  maxLength: 1500
      responses:
        '200':
          description: 已追加证据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/reports:
    get:
      summary: 本人提交的举报
      responses:
        '200':
          description: 举报列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: 举报物品、订单或账户
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_type, object_id, reason]
              properties:
                object_type:
                  type: string
                  enum: [ITEM, ORDER, ACCOUNT]
                object_id:
                  type: string
                reason:
                  type: string
                  maxLength: 1500
                evidence:
                  type: string
                  maxLength: 5000
      responses:
        '200':
          description: 已登记举报回执
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/messages:
    get:
      summary: 读取物品咨询或订单会话
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [ITEM, ORDER]
        - name: object
          in: query
          required: true
          schema:
            type: string
        - name: peer
          in: query
          schema:
            type: string
            description: |
              ITEM：非卖方（咨询人）可留空，咨询人由认证身份确定；传非空且不是本人的值返回 400。
              卖方必须给出真实咨询人（买方）的 id：空值或从未咨询过该物品的用户返回 400。
              ORDER：忽略，另一方由订单自动确定。
      responses:
        '200':
          description: 消息列表；会话为参与者私聊，消息内容按原文返回（不脱敏）。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 发送消息
      description: |
        ITEM 咨询对买卖双方执行同一可用性判断：物品不可公开咨询（已下单、隐藏、物主受限、撤回、已成交等）时
        双方发送均返回 400，历史仍可读；有效订单请使用 ORDER 专用会话。写入前先锁账户再对物品行加锁，
        并在锁后的最新状态上判定，并发下单不会让发送越过只读边界。参与者规则同 GET。
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [ITEM, ORDER]
        - name: object
          in: query
          required: true
          schema:
            type: string
        - name: peer
          in: query
          schema:
            type: string
            description: ITEM 同 GET 的 peer 规则（非卖方空值由认证身份确定，卖方必须给真实咨询人）；ORDER 忽略
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 1500
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/inbox:
    get:
      summary: 本人参与的会话入口
      responses:
        '200':
          description: 会话摘要
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    context_type:
                      type: string
                    context_id:
                      type: string
                    peer_id:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/notifications:
    get:
      summary: 最近 100 条站内通知
      description: |
        每次调用先补投此前投递失败或尚未投递的待发送通知（失败记录按失败次数轮转重试，不永久丢弃），再返回本人最近 100 条通知。
        业务提交后也会自动投递一次；补投失败只影响通知，不改变已成立的业务结果。
      responses:
        '200':
          description: 通知列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/dashboard:
    get:
      summary: 管理台审核与治理列表
      responses:
        '200':
          description: 物品、认证、账户、争议、举报、评价与审计记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  verifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Verification'
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicUser'
                  disputes:
                    type: array
                    description: 每条争议附带 title、stage（关联订单）与 evidence_log 补证记录
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Dispute'
                        - type: object
                          properties:
                            title:
                              type: string
                            stage:
                              type: string
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  logs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  facts:
                    type: array
                    description: 处置事实（含对象类型、具体动作、结果、前后值、版本与原因），最近 200 条
                    items:
                      type: object
                      additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/orders/{id}/details:
    get:
      summary: 管理员订单核查视图
      description: |
        仅当该订单存在关联争议或订单举报时返回 {order,delivery,reviews}，否则 400；每次查看追加一条带管理员身份的处置事实与审计日志。
        管理员不能冒用买方确认或评价，也不因此获得其他无关订单的访问权。
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 订单核查依据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/stats:
    get:
      summary: 业务统计（BR18 口径）
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
            description: 完成时间下界（含）
        - name: to
          in: query
          schema:
            type: string
            format: date-time
            description: 完成时间上界（不含）
      responses:
        '200':
          description: 成交笔数与金额、发布数、举报数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/{kind}/{id}:
    post:
      summary: 治理操作
      description: kind 见 README 的「管理操作」表；统一必填 reason（≤1500 字）。
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [verification, item, hide, restrict, relist, dispute, report, review]
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1500
                pass:
                  type: boolean
                version:
                  type: integer
                hidden:
                  type: boolean
                restricted:
                  type: boolean
                outcome:
                  type: string
                  enum: [continue, terminate]
                evidence_confirmed:
                  type: boolean
                event_ref:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: 已执行并留痕
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/assets:
    post:
      summary: 上传图片
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG 或 PNG，最大 5MB，像素不超过 1600 万
                kind:
                  type: string
                  enum: [ITEM, VERIFY]
      responses:
        '200':
          description: 图片标识
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/assets/{id}:
    get:
      summary: 读取图片
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 图片二进制（Cache-Control no-store）
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: HttpOnly、SameSite=Strict；HTTPS 交付时 Secure
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: 由 GET /api/me、注册或登录响应下发的 csrf；所有非 GET 请求必填
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: '[A-Za-z0-9_-]{8,100}；同一操作者同一标识只成立一次业务结果，重放返回原订单'
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,100}$'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: '[A-Za-z0-9_-]{8,100}；带标识时同一操作者同一标识只产生一次业务效果：相同内容返回原物品/原版本，不同内容返回 400；不带标识按新提交处理'
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,100}$'
  responses:
    BadRequest:
      description: 请求参数或业务条件不满足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 越权、CSRF 校验失败或当前状态不允许
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 对象不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 唯一约束冲突或并发锁冲突，本次未生效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 数据库不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Time:
      type: string
      format: date-time
      example: '2026-10-29T07:30:00.123Z'
      description: UTC ISO-8601，以 Z 结尾
    Money:
      type: number
      example: 25.00
      description: 人民币元，两位小数
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Ok:
      type: object
      properties:
        ok:
          type: boolean
          example: true
    Health:
      type: object
      properties:
        status:
          type: string
          example: UP
        database:
          type: string
          example: MySQL
        schema:
          type: string
          example: V2
        checkedAt:
          $ref: '#/components/schemas/Time'
    Category:
      type: string
      enum: [教材书籍, 数码配件, 宿舍生活, 运动户外, 其他]
    PublicUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        verified:
          type: integer
          enum: [0, 1]
        restricted:
          type: integer
          enum: [0, 1]
    PublicItem:
      type: object
      description: |
        GET /api/items 的公开投影：仅展示字段，不含审核说明 reason 与 hidden/relist_allowed 等治理字段。
        title、description、seller_name 返回前按 ImageGuard.mask 脱敏（BR14），联系方式替换为 [联系方式已隐藏]。
      properties:
        id:
          type: string
        seller_id:
          type: string
        seller_name:
          type: string
          description: 卖方公开昵称，按公开规则脱敏
        title:
          type: string
          description: 按公开规则脱敏（库中原文不改写）
        category:
          $ref: '#/components/schemas/Category'
        description:
          type: string
          description: 按公开规则脱敏（库中原文不改写）
        price:
          $ref: '#/components/schemas/Money'
        image_id:
          type: string
          nullable: true
        version:
          type: integer
        status:
          type: string
          enum: [在售]
        created_at:
          $ref: '#/components/schemas/Time'
    Item:
      type: object
      description: 本人（/api/items/mine）与管理台（dashboard.items）可见的完整记录，含 reason 与 hidden、relist_allowed。
      properties:
        id:
          type: string
        seller_id:
          type: string
        seller_name:
          type: string
          description: 仅公开列表与管理台返回
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        image_id:
          type: string
          nullable: true
        version:
          type: integer
        status:
          type: string
          enum: [待审, 在售, 审核退回, 已撤下, 交易中, 已成交, 交易异常终止]
        hidden:
          type: integer
          enum: [0, 1]
        reason:
          type: string
          nullable: true
          description: 管理员填写的审核说明（治理/本人可见），不在 GET /api/items 的公开投影中出现
        relist_allowed:
          type: integer
          enum: [0, 1]
        created_at:
          $ref: '#/components/schemas/Time'
    ItemInput:
      type: object
      required: [title, category, description, price, image_id]
      properties:
        title:
          type: string
          maxLength: 120
        category:
          $ref: '#/components/schemas/Category'
        description:
          type: string
          maxLength: 5000
        price:
          type: string
          description: 正数，最多两位小数，最大 9999999999.99
          example: '25.00'
        image_id:
          type: string
          description: 本人上传的 ITEM 类型图片
    Order:
      type: object
      description: 订单快照与当前阶段；快照不随后续物品修改回写
      properties:
        id:
          type: string
        item_id:
          type: string
        buyer_id:
          type: string
        seller_id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        image_id:
          type: string
          nullable: true
        buyer_name:
          type: string
        seller_name:
          type: string
        item_version:
          type: integer
        stage:
          type: string
          enum: [待卖方确认, 待交付, 待买方确认, 已完成, 已取消, 已拒绝, 已异常终止]
        disputed:
          type: integer
          enum: [0, 1]
        reminded:
          type: integer
          enum: [0, 1]
        reason:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Time'
        completed_at:
          $ref: '#/components/schemas/Time'
    OrderDetails:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'
        delivery:
          type: object
          nullable: true
          properties:
            order_id:
              type: string
            actor_id:
              type: string
            actor_name:
              type: string
            note:
              type: string
              description: 交付登记说明
            created_at:
              $ref: '#/components/schemas/Time'
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
    Review:
      type: object
      properties:
        id:
          type: string
        order_id:
          type: string
        author_id:
          type: string
        target_id:
          type: string
        score:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        hidden:
          type: integer
          enum: [0, 1]
        created_at:
          $ref: '#/components/schemas/Time'
    Dispute:
      type: object
      properties:
        id:
          type: string
        order_id:
          type: string
        author_id:
          type: string
        reason:
          type: string
        evidence:
          type: string
        status:
          type: string
          enum: [处理中, 已结案]
        outcome:
          type: string
          nullable: true
          enum: [继续履约, 异常终止, 买方确认完成]
        decision:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Time'
        evidence_log:
          type: array
          description: 补证记录（按提交时间升序）；GET /api/disputes 与管理台 GET /api/admin/dashboard 的 disputes 均附带，原 evidence 不被改写
          items:
            $ref: '#/components/schemas/DisputeEvidence'
    DisputeEvidence:
      type: object
      properties:
        id:
          type: string
        author_id:
          type: string
        content:
          type: string
        created_at:
          $ref: '#/components/schemas/Time'
    Report:
      type: object
      properties:
        id:
          type: string
        author_id:
          type: string
        object_type:
          type: string
          enum: [ITEM, ORDER, ACCOUNT]
        object_id:
          type: string
        reason:
          type: string
        evidence:
          type: string
        status:
          type: string
          enum: [待处理, 已处理]
        result:
          type: string
          nullable: true
        event_ref:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Time'
    Message:
      type: object
      properties:
        id:
          type: string
        context_type:
          type: string
          enum: [ITEM, ORDER]
        context_id:
          type: string
        sender_id:
          type: string
        receiver_id:
          type: string
        content:
          type: string
        created_at:
          $ref: '#/components/schemas/Time'
        sender_name:
          type: string
    Notification:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        content:
          type: string
        created_at:
          $ref: '#/components/schemas/Time'
    FavoriteEntry:
      type: object
      description: |
        GET /api/favorites 的条目。可访问：{id,title,price,status,unavailable:false}；
        不可访问（待审/审核退回/隐藏/物主受限/已撤下/有占用等，与市场“可交易”同一规则）：
        只返回 {id,unavailable:true}，保证收藏关系保留、可取消，同时不露出任何内容。
      required: [id, unavailable]
      properties:
        id:
          type: string
        unavailable:
          type: boolean
        title:
          type: string
          description: 仅 unavailable=false 时返回；按 ImageGuard.mask 脱敏（与公开物品同一规则，库中原文不改写）
        price:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          description: 仅 unavailable=false 时返回（此时恒为“在售”）
    FavoriteResult:
      type: object
      description: 收藏操作结果；favorite 为期望/当前目标状态
      properties:
        ok:
          type: boolean
          example: true
        favorite:
          type: boolean
          description: true 为已收藏，false 为未收藏
        item_id:
          type: string
    Verification:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        student_no:
          type: string
        real_name:
          type: string
        asset_id:
          type: string
        status:
          type: string
          enum: [待审, 通过, 退回]
        reason:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Time'
    Stats:
      type: object
      description: 成交按完成时间左闭右开筛选，金额按订单快照；发布与举报为累计值
      properties:
        sales:
          type: object
          properties:
            count:
              type: integer
            amount:
              $ref: '#/components/schemas/Money'
        items:
          type: object
          properties:
            count:
              type: integer
        reports:
          type: object
          properties:
            count:
              type: integer
        basis:
          type: string








